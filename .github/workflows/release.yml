# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example: v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            git fetch --tags --force
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG was not found in repository history." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must follow semver format vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes body
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          {
            echo "## NeuroRoutine $TAG"
            echo
            echo "Release generated by workflow."
            echo
            echo "- See changelog: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            echo "- Deployment guide: https://github.com/${{ github.repository }}/blob/main/docs/deployment/README.md"
          } > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true

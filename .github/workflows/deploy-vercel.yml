# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gate deploy (requires Vercel token + ids)
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: missing VERCEL_TOKEN secret or VERCEL_ORG_ID / VERCEL_PROJECT_ID variables." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Validate token + project linkage before install/build to avoid noisy failures.
          if ! npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: Vercel auth/project validation failed. Check VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env VITE_BUILD_SHA="$VITE_BUILD_SHA" \
            --build-env VITE_BUILD_RUN_NUMBER="$VITE_BUILD_RUN_NUMBER"

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy (Vercel)

# Gated on CI (see ci.yml) finishing successfully on main, instead of firing independently off
# the same push — previously a lint/test/build/bundle-budget failure did not stop this from
# deploying broken code to production (audit finding, Disponibilidad). workflow_dispatch is kept
# for manual redeploys (e.g. re-running a deploy without re-running CI).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    # Only deploy when explicitly triggered by hand, or when the triggering CI run actually
    # passed — a workflow_run event fires on every CI completion, success or failure.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # workflow_run always checks out the default branch by default, which can be a newer,
          # not-yet-CI-validated commit than the one that actually triggered this run — pin to
          # the exact commit CI validated instead.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gate deploy (requires Vercel token + ids)
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: missing VERCEL_TOKEN secret or VERCEL_ORG_ID / VERCEL_PROJECT_ID variables." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Validate token + project linkage before install/build to avoid noisy failures.
          if ! npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: Vercel auth/project validation failed. Check VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VITE_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          VITE_BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env VITE_BUILD_SHA="$VITE_BUILD_SHA" \
            --build-env VITE_BUILD_RUN_NUMBER="$VITE_BUILD_RUN_NUMBER"

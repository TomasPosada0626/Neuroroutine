name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Weekly, not on every PR: Stryker re-runs the suite once per mutant and is too
    # slow to gate merges, but the score is still worth tracking over time.
    - cron: '0 6 * * 1'

jobs:
  stryker:
    name: Stryker mutation score (frontend/src/features/routines, shared/lib)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: frontend/reports/mutation
          retention-days: 30

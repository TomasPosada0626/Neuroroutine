# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy (Render)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Render
    runs-on: ubuntu-latest

    steps:
      - name: Gate deploy (requires deploy hook)
        id: gate
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: missing RENDER_DEPLOY_HOOK_URL secret." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK_URL" =~ ^https:// ]]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: RENDER_DEPLOY_HOOK_URL must start with https://" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Trigger Render deploy hook
        if: steps.gate.outputs.ok == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          http_code=$(curl \
            --request POST \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            "$RENDER_DEPLOY_HOOK_URL")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Render deploy hook failed with HTTP $http_code" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Render deploy hook triggered (HTTP $http_code)." >> $GITHUB_STEP_SUMMARY

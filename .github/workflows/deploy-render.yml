# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy (Render)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Render
    runs-on: ubuntu-latest

    steps:
      - name: Gate deploy (requires deploy hook)
        id: gate
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy: missing RENDER_DEPLOY_HOOK_URL secret." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "ok=true" >> $GITHUB_OUTPUT

      - name: Trigger Render deploy hook
        if: steps.gate.outputs.ok == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered." >> $GITHUB_STEP_SUMMARY

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

  e2e-rls-regression:
    name: RLS regression E2E (required)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Check RLS E2E secrets
        env:
          E2E_USER_A_IDENTIFIER: ${{ secrets.E2E_USER_A_IDENTIFIER }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_IDENTIFIER: ${{ secrets.E2E_USER_B_IDENTIFIER }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$E2E_USER_A_IDENTIFIER" ] || (echo "Missing E2E_USER_A_IDENTIFIER" && exit 1)
          [ -n "$E2E_USER_A_PASSWORD" ] || (echo "Missing E2E_USER_A_PASSWORD" && exit 1)
          [ -n "$E2E_USER_B_IDENTIFIER" ] || (echo "Missing E2E_USER_B_IDENTIFIER" && exit 1)
          [ -n "$E2E_USER_B_PASSWORD" ] || (echo "Missing E2E_USER_B_PASSWORD" && exit 1)
          [ -n "$VITE_SUPABASE_URL" ] || (echo "Missing VITE_SUPABASE_URL" && exit 1)
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)

      - name: RLS isolation tests
        env:
          E2E_USER_A_IDENTIFIER: ${{ secrets.E2E_USER_A_IDENTIFIER }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_IDENTIFIER: ${{ secrets.E2E_USER_B_IDENTIFIER }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx playwright test e2e/routines.spec.ts -g "RLS"

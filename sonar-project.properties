sonar.projectKey=neuroroutine
sonar.projectName=NeuroRoutine
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src
sonar.tests=frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/__tests__/**
sonar.exclusions=frontend/dist/**,frontend/coverage/**,frontend/playwright-report/**,frontend/test-results/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
